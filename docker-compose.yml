services:
  scoutcam-postgres:
    image: postgres
    container_name: scoutcam-postgres
    env_file:
      - .env-docker
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - scoutcam-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - scoutcam-network

  scoutcam-redis:
    image: redis
    container_name: scoutcam-redis
    ports:
      - "6379:6379"
    networks:
      - scoutcam-network

  scoutcam-web-service:
    build: .
    image: scoutcamwebservice:0.1.0
    container_name: scoutcam-web-service
    env_file:
      - .env-docker
    tty: true
    stdin_open: true
    depends_on:
      scoutcam-postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - scoutcam-network

  scoutcam-celery-worker:
    build: .
    command: celery -A scoutcamservice worker -l info
    image: scoutcamwebservice-celery-worker:0.1.0
    container_name: scoutcam-celery-worker
    env_file:
      - .env-docker
    tty: true
    stdin_open: true
    depends_on:
      - scoutcam-redis
      - scoutcam-web-service
    networks:
      - scoutcam-network

  scoutcam-celery-beat:
    build: .
    command: celery -A scoutcamservice beat -l info
    image: scoutcamwebservice-celery-beat:0.1.0
    container_name: scoutcam-celery-beat
    env_file:
      - .env-docker
    tty: true
    stdin_open: true
    depends_on:
      - scoutcam-redis
      - scoutcam-web-service
    networks:
      - scoutcam-network

  scout-media-mtx:
    image: bluenviron/mediamtx:1
    container_name: scout-media-mtx
    environment:
      MTX_RTSPTRANSPORTS: tcp
      MTX_WEBRTCADDITIONALHOSTS: ${DEV_IP}
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554"
      - "8888:8888"
      - "8889:8889"
      - "9997:9997"
      - "8189:8189/udp"
    networks:
      - scoutcam-network

networks:
  scoutcam-network:
    name: scoutcam-network
    external: true

volumes:
  scoutcam-postgres-data:


# Cheat Sheet
# Build image and start container - docker compose up -d --build <container_nam>
# Restart container - docker compose up -d --no-deps <container_name>
