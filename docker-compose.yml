services:
  scoutcam-postgres:
    image: postgres
    container_name: scoutcam-postgres
    env_file:
      - .env-docker
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - scoutcam-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - scoutcam-network

  scoutcam-redis:
    image: redis
    container_name: scoutcam-redis

  scoutcam-web-service:
    build: .
    image: scoutcamwebservice-dev
    container_name: scoutcam-web-service
    env_file:
      - .env-docker
    tty: true
    stdin_open: true
    depends_on:
      scoutcam-postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Uncomment to give the container access to your AWS credentials, matching
    # the (disabled) mount in the old start_service_container-dev.sh script.
    # volumes:
    #   - ~/.aws:/home/appuser/.aws:ro
    networks:
      - scoutcam-network

  scout-media-mtx:
    image: bluenviron/mediamtx:1
    container_name: scout-media-mtx
    environment:
      MTX_RTSPTRANSPORTS: tcp
      MTX_WEBRTCADDITIONALHOSTS: ${DEV_IP}
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554"
      - "8888:8888"
      - "8889:8889"
      - "8189:8189/udp"
    networks:
      - scoutcam-network

networks:
  scoutcam-network:
    name: scoutcam-network
    external: true

volumes:
  scoutcam-postgres-data:
