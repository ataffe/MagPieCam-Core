name: ScoutCam-Backend
services:
  scoutcam-postgres:
    image: postgres
    container_name: scoutcam-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - scoutcam-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - scoutcam-network

  scoutcam-redis:
    image: redis
    container_name: scoutcam-redis
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
    networks:
      - scoutcam-network

  scoutcam-web-service:
    build: .
    image: scoutcam-webservice:0.1.0
    container_name: scoutcam-web-service
    env_file:
      - .env
    tty: true
    stdin_open: true
    depends_on:
      scoutcam-postgres:
        condition: service_healthy
      scout-moto:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - scoutcam-network

  # The worker runs both camera.tasks (stream sweeping) and events.tasks (image
  # evaluation), so it needs requirements/worker.txt
  scoutcam-celery-worker:
    build:
      context: .
      args:
        REQUIREMENTS: requirements/worker.txt
    image: scoutcam-webservice-worker:0.1.0
    container_name: scoutcam-celery-worker
    command: celery -A scoutcamservice worker -l ${CELERY_WORKER_LOG_LEVEL:-INFO}
    env_file:
      - .env
    tty: true
    stdin_open: true
    depends_on:
      scoutcam-postgres:
        condition: service_healthy
      scoutcam-redis:
        condition: service_healthy
      scout-moto:
        condition: service_healthy
    networks:
      - scoutcam-network

  # Beat only schedules; it shares the worker image so there's one build to keep
  # in sync rather than three.
  scoutcam-celery-beat:
    build:
      context: .
      args:
        REQUIREMENTS: requirements/worker.txt
    image: scoutcam-webservice-worker:0.1.0
    container_name: scoutcam-celery-beat
    command: celery -A scoutcamservice beat -l ${CELERY_BEAT_LOG_LEVEL:-INFO}
    env_file:
      - .env
    tty: true
    stdin_open: true
    depends_on:
      scoutcam-redis:
        condition: service_healthy
    networks:
      - scoutcam-network

  scoutcam-event-consumer:
    build:
      context: .
      args:
        REQUIREMENTS: requirements/worker.txt
    image: scoutcam-webservice-worker:0.1.0
    container_name: scoutcam-event-consumer
    command: python manage.py consume_events
    env_file:
      - .env
    depends_on:
      scoutcam-postgres:
        condition: service_healthy
      scoutcam-redis:
        condition: service_healthy
      scout-moto:
        condition: service_healthy
    networks:
      - scoutcam-network

  # Mocks S3 and SQS for local dev so nothing touches real AWS. Seeds the
  # buckets/queue from .env-docker on every start since moto keeps no state.
  scout-moto:
    build:
      context: ./docker/moto
    image: scoutcam-moto:0.1.0
    container_name: scout-moto
    env_file:
      - .env
    ports:
      - "5001:5001" # These need to match for presigned urls in dev env.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/moto-api/')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - scoutcam-network

  scout-media-mtx:
    image: bluenviron/mediamtx:1
    container_name: scout-media-mtx
    environment:
      MTX_RTSPTRANSPORTS: tcp
      MTX_WEBRTCADDITIONALHOSTS: ${DEV_IP}
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554"
      - "8888:8888"
      - "8889:8889"
      - "9997:9997"
      - "8189:8189/udp"
    networks:
      - scoutcam-network

networks:
  scoutcam-network:
    name: scoutcam-network
    external: true

volumes:
  scoutcam-postgres-data:
